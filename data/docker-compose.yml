services:
  postgres:
    container_name: data-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - data
    restart: unless-stopped

  redis:
    container_name: data-redis
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - data
    restart: unless-stopped

  pgadmin:
    container_name: data-pgadmin
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: unless-stopped

  redis-insight:
    container_name: data-redisinsight
    image: redis/redisinsight:3.8
    ports:
      - "${REDIS_INSIGHT_PORT}:5540"
    volumes:
      - redisinsightdata:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - data
    restart: unless-stopped

networks:
  data:
    name: data

volumes:
  pgdata:
  redisdata:
  pgadmindata:
  redisinsightdata: