receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  file_log/podman:
    include:
      - /var/lib/containers/storage/overlay-containers/*/userdata/ctr.log
    start_at: beginning
    include_file_name: true
    include_file_path: true

    operators:
      # Podman ctr.log format:
      # <timestamp> <stream> <logtag> <log>
      - id: podman-parser
        type: regex_parser
        regex: '^(?P<time>\S+)\s+(?P<stream>stdout|stderr)\s+(?P<logtag>\S+)\s?(?P<log>.*)$'

      # Recombine multiline logs. "F" marks the final partial entry.
      - id: podman-recombine
        type: recombine
        combine_field: attributes.log
        combine_with: ""
        is_last_entry: attributes.logtag == "F"
        source_identifier: attributes["log.file.path"]

      - id: podman-metadata
        type: regex_parser
        parse_from: attributes["log.file.path"]
        regex: '^.*/overlay-containers/(?P<container_id>[a-f0-9]+)/userdata/ctr\.log$'

      # Keep container.id at resource level so it is propagated consistently
      # with other resource attributes such as service.name.
      - id: container-id-to-resource
        type: move
        from: attributes.container_id
        to: resource["container.id"]

      - id: stream-to-attribute
        type: move
        from: attributes.stream
        to: attributes["log.iostream"]

      - id: log-to-body
        type: move
        from: attributes.log
        to: body

      # Parse application JSON into attributes so fields such as "service"
      # can be promoted to resource attributes by subsequent operators.
      - id: application-json
        type: json_parser
        parse_from: body
        parse_to: attributes

      - id: set-service-name
        type: move
        from: attributes.service
        to: resource["service.name"]

  file_log/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: beginning
    include_file_name: true
    include_file_path: true

    operators:
      - id: docker-parser
        type: json_parser
        parse_from: body

      - id: docker-stream
        type: move
        from: attributes.stream
        to: attributes["log.iostream"]

      - id: docker-log
        type: move
        from: attributes.log
        to: body

      # Parse application JSON into attributes so fields such as "service"
      # can be promoted to resource attributes by the next operator.
      - id: docker-application-json
        type: json_parser
        parse_from: body
        parse_to: attributes

      - id: docker-set-service-name
        type: move
        from: attributes.service
        to: resource["service.name"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true

  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/v1/push
    retry_on_failure:
      enabled: true
    remote_write_queue:
      enabled: true

  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 1

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions:
    - health_check
    - pprof

  telemetry:
    logs:
      level: debug

  pipelines:
    logs:
      receivers:
        - file_log/podman
        - file_log/docker
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlphttp/loki
        - debug

    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlp/tempo

    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - prometheusremotewrite/mimir