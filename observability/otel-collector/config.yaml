receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: end
    operators:
      - type: json_parser
        parse_from: body
      - type: json_parser
        parse_from: attributes.log
        parse_to: body
      - type: move
        from: body.service
        to: resource["service.name"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 1024

# TODO Exporters: add retry on failure and sending queue
exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/v1/push

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions:
    - health_check
    - pprof

  pipelines:
    logs:
      receivers:
        - filelog/docker
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlphttp/loki

    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlp/tempo

    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - prometheusremotewrite/mimir