receivers:
  # ============================================================
  # OTLP
  # ============================================================
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # ============================================================
  # PODMAN
  # ============================================================
  file_log/podman:
    include:
      - /var/lib/containers/storage/overlay-containers/*/userdata/ctr.log

    # Keep existing startup/replay behavior.
    start_at: beginning

    # Keep existing polling latency.
    poll_interval: 200ms

    # Keep existing copytruncate behavior.
    on_truncate: read_new

    # log.file.path is required by recombine and metadata parser.
    include_file_name: true
    include_file_path: true

    operators:
      # Podman CRI-style:
      # <timestamp> <stream> <logtag> <log>
      - id: podman-parser
        type: regex_parser
        regex: '^(?P<time>\S+)\s+(?P<stream>stdout|stderr)\s+(?P<logtag>\S+)\s?(?P<log>.*)$'

      # Recombine P/F records.
      - id: podman-recombine
        type: recombine
        combine_field: attributes.log
        combine_with: ""
        is_last_entry: attributes.logtag == "F"
        source_identifier: attributes["log.file.path"]

      # Extract container ID from path.
      - id: podman-metadata
        type: regex_parser
        parse_from: attributes["log.file.path"]
        regex: '^.*/overlay-containers/(?P<container_id>[a-f0-9]+)/userdata/ctr\.log$'

      # container_id -> resource.container.id
      - id: container-id-to-resource
        type: move
        from: attributes.container_id
        to: resource["container.id"]

      # stdout/stderr -> log.iostream
      - id: stream-to-attribute
        type: move
        from: attributes.stream
        to: attributes["log.iostream"]

      # Application log -> body
      - id: log-to-body
        type: move
        from: attributes.log
        to: body

      # Application JSON -> attributes
      - id: application-json
        type: json_parser
        parse_from: body
        parse_to: attributes

      # service -> resource.service.name
      - id: set-service-name
        type: move
        from: attributes.service
        to: resource["service.name"]

  # ============================================================
  # DOCKER
  # ============================================================
  file_log/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log

    # Keep existing startup/replay behavior.
    start_at: beginning

    # Keep existing polling latency.
    poll_interval: 200ms

    # Keep existing copytruncate behavior.
    on_truncate: read_new

    include_file_name: true
    include_file_path: true

    operators:
      # Docker json-file:
      # {"log":"...","stream":"stdout","time":"..."}
      - id: docker-parser
        type: json_parser
        parse_from: body

      # stdout/stderr -> log.iostream
      - id: docker-stream
        type: move
        from: attributes.stream
        to: attributes["log.iostream"]

      # Docker log -> body
      - id: docker-log
        type: move
        from: attributes.log
        to: body

      # Application JSON -> attributes
      - id: docker-application-json
        type: json_parser
        parse_from: body
        parse_to: attributes

      # service -> resource.service.name
      - id: docker-set-service-name
        type: move
        from: attributes.service
        to: resource["service.name"]


# ==============================================================
# PROCESSORS
# ==============================================================
processors:
  # Must remain first in every pipeline.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Keep existing batching behavior.
  batch:
    timeout: 1s
    send_batch_size: 256


# ==============================================================
# EXPORTERS
# ==============================================================
exporters:
  # ============================================================
  # LOKI
  # ============================================================
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

    retry_on_failure:
      enabled: true

    sending_queue:
      enabled: true

  # ============================================================
  # TEMPO
  # ============================================================
  otlp/tempo:
    endpoint: tempo:4317

    tls:
      insecure: true

    retry_on_failure:
      enabled: true

    sending_queue:
      enabled: true

  # ============================================================
  # MIMIR
  # ============================================================
  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/v1/push

    retry_on_failure:
      enabled: true

    remote_write_queue:
      enabled: true


# ==============================================================
# EXTENSIONS
# ==============================================================
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  pprof:
    endpoint: 0.0.0.0:1777


# ==============================================================
# SERVICE
# ==============================================================
service:
  extensions:
    - health_check
    - pprof

  telemetry:
    logs:
      level: info

  pipelines:
    # ==========================================================
    # LOGS
    # ==========================================================
    logs:
      receivers:
        - file_log/podman
        - file_log/docker
        - otlp

      # memory_limiter -> batch is intentional.
      processors:
        - memory_limiter
        - batch

      exporters:
        - otlphttp/loki

    # ==========================================================
    # TRACES
    # ==========================================================
    traces:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters:
        - otlp/tempo

    # ==========================================================
    # METRICS
    # ==========================================================
    metrics:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters:
        - prometheusremotewrite/mimir