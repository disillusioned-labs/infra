target: all

multitenancy_enabled: false

server:
  http_listen_port: 9009

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data

ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: inmemory

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  tsdb:
    dir: /data/tsdb

limits:
  compactor_blocks_retention_period: 3d

compactor:
  data_dir: /data/compactor

store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: inmemory