services:
  otel-collector:
    container_name: observability-otel-collector
    image: otel/opentelemetry-collector-contrib:0.158.0
    user: "0:0"
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "13133:13133"
      - "1777:1777"
    networks:
      - observability
    restart: unless-stopped

  loki:
    container_name: observability-loki
    image: grafana/loki:3.7.5
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - observability
    restart: unless-stopped

  tempo:
    container_name: observability-tempo
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - observability
    restart: unless-stopped

  mimir:
    container_name: observability-mimir
    image: grafana/mimir:3.0.0
    command:
      - "-config.file=/etc/mimir/config.yaml"
    volumes:
      - ./mimir/config.yaml:/etc/mimir/config.yaml:ro
      - mimir-data:/data
    ports:
      - "9009:9009"
    networks:
      - observability
    restart: unless-stopped

  grafana:
    container_name: observability-grafana
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability
    restart: unless-stopped

networks:
  observability:
    name: observability

volumes:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data: