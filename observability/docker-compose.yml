services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: [ "--config=/etc/otel-collector.yaml" ]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "8888:8888"     # collector's own metrics
      - "13133:13133"   # health check
      - "1777:1777"     # pprof