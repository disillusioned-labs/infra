services:
  otel-collector:
    container_name: observability-otel-collector
    image: otel/opentelemetry-collector-contrib:0.158.0
    user: "0:0"
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector.yaml:ro
      # Docker json-file logs
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Podman k8s-file logs
      - /var/lib/containers/storage/overlay-containers:/var/lib/containers/storage/overlay-containers:ro
      # Filelog receiver checkpoint offsets (persist across restart)
      - otel-file-storage:/var/lib/otelcol/file_storage
    ports:
      # Loopback-only: OTLP/health/pprof/metrics must not be reachable from the LAN -
      # the receivers accept unauthenticated pushes from anyone who can reach the port.
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "13133:13133"
      - "1777:1777"
    networks:
      - observability
    restart: unless-stopped

  loki:
    container_name: observability-loki
    image: grafana/loki:3.7.5
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - observability
    restart: unless-stopped

  tempo:
    container_name: observability-tempo
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - observability
    restart: unless-stopped

  mimir:
    container_name: observability-mimir
    image: grafana/mimir:3.0.0
    command:
      - "-config.file=/etc/mimir/config.yaml"
    volumes:
      - ./mimir/config.yaml:/etc/mimir/config.yaml:ro
      - mimir-data:/data
    ports:
      - "9009:9009"
    networks:
      - observability
    restart: unless-stopped

  grafana:
    container_name: observability-grafana
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability
      - podman-ipv6
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  uptime-kuma:
    container_name: observability-uptime-kuma
    image: louislam/uptime-kuma:2.5.5
    ports:
      - "${UPTIME_KUMA_PORT:-3002}:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - observability
      - data
      - messaging
      - kuma-control
    depends_on:
      podman-socket-proxy:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/entry-page').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  podman-socket-proxy:
    container_name: observability-podman-socket-proxy
    image: docker.io/tecnativa/docker-socket-proxy:v0.5.0
    environment:
      # Kuma only needs read access to list and inspect containers.
      CONTAINERS: "1"
      PING: "1"
      VERSION: "1"
      EVENTS: "0"
      POST: "0"
      ALLOW_PAUSE: "0"
      ALLOW_RESTARTS: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_UNPAUSE: "0"
    volumes:
      - "${PODMAN_SOCKET_PATH:-/run/podman/podman.sock}:/var/run/docker.sock:ro"
    networks:
      - kuma-control
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,size=16m,mode=1777
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  kuma-provisioner:
    container_name: observability-kuma-provisioner
    profiles: ["ops"]
    build:
      context: ./kuma
    environment:
      KUMA_URL: http://uptime-kuma:3001
      KUMA_USERNAME: "${KUMA_USERNAME:-admin}"
      KUMA_PASSWORD: "${KUMA_PASSWORD:?set KUMA_PASSWORD in observability/.env}"
    depends_on:
      uptime-kuma:
        condition: service_healthy
    networks:
      - observability
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

networks:
  observability:
    name: observability

  podman-ipv6:
    external: true
    name: podman-ipv6

  data:
    external: true
    name: data

  messaging:
    external: true
    name: messaging

  kuma-control:
    name: kuma-control
    internal: true

volumes:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
  otel-file-storage:
  uptime-kuma-data:
    name: kuma_uptime-kuma-data
