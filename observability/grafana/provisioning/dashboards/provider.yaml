apiVersion: 1

providers:
  - name: expense-platform
    orgId: 1
    folder: Expense Platform
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Mounted via docker-compose: ./grafana/provisioning -> /etc/grafana/provisioning
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
