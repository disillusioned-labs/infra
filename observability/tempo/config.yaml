server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/traces

backend_scheduler:
  provider:
    compaction:
      compaction:
        compaction_window: 1h
        block_retention: 72h

backend_worker:
  compaction:
    compaction_window: 1h
    block_retention: 72h